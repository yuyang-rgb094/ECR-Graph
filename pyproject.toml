[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecr-graph"
version = "0.1.0"
description = "Evidence-governed engineering-change graph toolkit: extraction, dedupe, disambiguation, cross-review, change sufficiency and registration-impact pre-assessment."
requires-python = ">=3.9"
dependencies = []
# license: to be decided by the project owner before publication (see docs/RELEASE-CHECKLIST.md)

[project.optional-dependencies]
pdf = ["pypdf>=4"]

[project.scripts]
ecr-graph = "ecr_graph.cli:main"

[tool.setuptools.packages.find]
include = ["ecr_graph*"]

[tool.setuptools.package-data]
ecr_graph = []
